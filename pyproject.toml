[project]
name = "iotpi"
version = "0.1.0"
description = "TrustGate: budgeted local containment of prompt-injection cascades in IoT agent networks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
mac = ["mlx==0.29.4", "mlx-lm==0.29.1"]
classifier = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "scipy>=1.11", "statsmodels>=0.14"]
paper = ["matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
